name: Build BouncingBall IPA

on:
  push:
    paths:
      - 'ios/BouncingBall/**'
      - '.github/workflows/build-ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: ios/BouncingBall/build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BouncingBall-ipa
          path: ios/BouncingBall/build/BouncingBall.ipa
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bouncingball-v1.0-build${{ github.run_number }}
          name: BouncingBall v1.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            SwiftUI app showing a red ball bouncing up and down. Requires iOS 15+.
            The IPA is ad-hoc signed; install with AltStore, Sideloadly or TrollStore.
          files: ios/BouncingBall/build/BouncingBall.ipa
